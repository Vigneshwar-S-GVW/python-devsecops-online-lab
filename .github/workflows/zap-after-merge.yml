name: OWASP ZAP After Merge

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-after-merge
  cancel-in-progress: true

jobs:
  staging-zap-scan:
    name: Start temporary staging and run ZAP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start temporary FastAPI application
        run: |
          nohup uvicorn sample_api.main:app \
            --app-dir src \
            --host 0.0.0.0 \
            --port 8000 \
            > application.log 2>&1 &

          echo $! > application.pid
          echo "Application process started"

      - name: Wait for application health check
        run: |
          for attempt in {1..30}; do
            echo "Health-check attempt ${attempt}"

            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8000/health; then
              echo
              echo "Application is healthy"
              exit 0
            fi

            sleep 2
          done

          echo "Application failed to start"
          cat application.log
          exit 1

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:8000
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-after-merge-report
          cmd_options: "-a"

      - name: Show application log
        if: always()
        run: cat application.log

      - name: Create workflow summary
        if: always()
        run: |
          {
            echo "## OWASP ZAP learning scan"
            echo ""
            echo "- Commit: $GITHUB_SHA"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Target: temporary FastAPI application"
            echo "- URL inside runner: http://127.0.0.1:8000"
            echo ""
            echo "Download the ZAP report from the Artifacts section."
          } >> "$GITHUB_STEP_SUMMARY"